name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (must match VERSION at that tag)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Verify and build release
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      dmg_name: ${{ steps.metadata.outputs.dmg_name }}
      sha256: ${{ steps.metadata.outputs.sha256 }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, version, and main ancestry
        run: |
          set -euo pipefail
          python3 tools/release-metadata.py --check-version --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify release tooling and Swift core
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests-release -v
          swift test -Xswiftc -warnings-as-errors
      - name: Build and verify app and DMG
        run: |
          set -euo pipefail
          make dmg
          python3 tools/verify-bundle.py
      - name: Generate release metadata and validate Homebrew cask
        id: metadata
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/release-metadata.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
          ruby -c dist/mac-fan-controller.rb
          brew style dist/mac-fan-controller.rb
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('dist/release.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('tag', 'dmg_name', 'sha256', 'prerelease'):
                  value = metadata[key]
                  output.write(f'{key}={str(value).lower() if isinstance(value, bool) else value}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.dmg
            dist/mac-fan-controller.rb
            dist/SHA256SUMS
            dist/release.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          args=(--verify-tag --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" ./*.dmg SHA256SUMS mac-fan-controller.rb release.json "${args[@]}"

  homebrew:
    name: Update Homebrew tap
    runs-on: macos-15
    needs: [build, publish]
    timeout-minutes: 15
    concurrency:
      group: mac-fan-controller-homebrew-tap
      cancel-in-progress: false
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo '::error::Configure TAP_TOKEN with Contents read/write access to tasnimzotder/homebrew-tap.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: tasnimzotder/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tap
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify published asset matches the cask
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern "$DMG_NAME" --dir published
          actual_sha=$(shasum -a 256 "published/$DMG_NAME" | awk '{print $1}')
          test "$actual_sha" = "$EXPECTED_SHA256"
          grep -F "sha256 \"$EXPECTED_SHA256\"" dist/mac-fan-controller.rb
      - name: Validate and update cask
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          cp dist/mac-fan-controller.rb homebrew-tap/Casks/mac-fan-controller.rb
          ruby -c homebrew-tap/Casks/mac-fan-controller.rb
          brew style homebrew-tap/Casks/mac-fan-controller.rb
          git -C homebrew-tap config user.name 'github-actions[bot]'
          git -C homebrew-tap config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C homebrew-tap add Casks/mac-fan-controller.rb
          if git -C homebrew-tap diff --cached --quiet; then exit 0; fi
          git -C homebrew-tap commit -m "Update mac-fan-controller to $RELEASE_TAG"
          git -C homebrew-tap push
